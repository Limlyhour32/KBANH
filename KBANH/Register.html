<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #efece7;
    --bg-panel: #ffffff;
    --bg-field: #f6f5f3;
    --border-col: #dcdad6;
    --border-focus: #000000;
    --teal: #000000;
    --red: #000000;
    --text-main: #000000;
    --text-muted: #767676;
    --text-label: #333333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(0, 0, 0, 0.03), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(0, 0, 0, 0.03), transparent 40%),
      var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 520px;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-col);
    border-radius: 14px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }

  /* Tab strip like chart symbol tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border-col);
    background: #f6f5f3;
  }

  .tab-btn {
    flex: 1;
    padding: 16px 0;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.4px;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    transition: color 0.25s ease;
  }

  .tab-btn.active {
    color: var(--text-main);
  }

  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--teal);
  }

  .tab-btn#registerTab.active::after {
    background: var(--red);
  }

  .content {
    padding: 32px 30px 30px;
  }

  .heading {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text-main);
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }

  .subheading {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 26px;
  }

  .form-panel { display: none; flex-direction: column; gap: 16px; }
  .form-panel.active { display: flex; }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-label);
    margin-bottom: 7px;
    letter-spacing: 0.2px;
  }

  .field input[type="text"],
  .field input[type="email"],
  .field input[type="url"],
  .field input[type="password"],
  .field input[type="date"],
  .field input[type="time"],
  .field select,
  .field textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg-field);
    border: 1px solid var(--border-col);
    border-radius: 9px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field select { color-scheme: light; cursor: pointer; }
  .field input[type="date"],
  .field input[type="time"] { color-scheme: light; }

  .field input::placeholder { color: var(--text-muted); }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
  }

  .field input[type="color"] {
    width: 100%;
    height: 42px;
    padding: 3px;
    background: var(--bg-field);
    border: 1px solid var(--border-col);
    border-radius: 9px;
    cursor: pointer;
  }
  .field input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  .field input[type="color"]::-webkit-color-swatch { border-radius: 6px; border: none; }

  /* file upload */
  .file-drop {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-field);
    border: 1px dashed var(--border-col);
    border-radius: 9px;
    padding: 12px 14px;
    position: relative;
    transition: border-color 0.2s ease;
  }
  .file-drop:hover { border-color: var(--teal); }
  .file-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .file-btn {
    background: linear-gradient(135deg, #ffffff, #efece7);
    border: 1px solid var(--border-col);
    color: var(--text-main);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
    white-space: nowrap;
  }
  .file-name { font-size: 12.5px; color: var(--text-muted); }

  .field select[multiple] {
    height: 120px;
    padding: 8px 10px;
  }
  .field select[multiple] option {
    padding: 6px 8px;
    border-radius: 5px;
  }

  .hint {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 5px;
  }

  .submit-btn {
    margin-top: 6px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg, #000000, #2a2a2a);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
  }

  #registerForm .submit-btn {
    background: linear-gradient(135deg, #000000, #2a2a2a);
    color: #ffffff;
  }
  #registerForm .submit-btn:hover {
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
  }

  .success-msg {
    display: none;
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 0, 0, 0.25);
    color: var(--teal);
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 2px;
  }
  .success-msg.show { display: block; }

  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 4px 0 2px;
    color: var(--text-muted); font-size: 11px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border-col);
  }

  @media (max-width: 480px) {
    .content { padding: 26px 20px 24px; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Log In</button>
      <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register</button>
    </div>

    <div class="content">

      <!-- LOGIN -->
      <div class="form-panel active" id="loginPanel">
        <div>
          <div class="heading">Welcome back</div>
          <div class="subheading">Log in to access your dashboard.</div>
        </div>
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="submit-btn" style="width:100%;">Log In</button>
          <div class="success-msg" id="loginSuccess">Logged in successfully.</div>
        </form>
      </div>

      <!-- REGISTER -->
      <div class="form-panel" id="registerPanel">
        <div>
          <div class="heading">Create account</div>
          <div class="subheading">Fill in your details to get started.</div>
        </div>

        <form id="registerForm">
          <div class="field">
            <label for="regUsername">User name</label>
            <input type="text" id="regUsername" placeholder="Enter your username" required>
          </div>

          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="regUrl">URL</label>
            <input type="url" id="regUrl" placeholder="https://yourwebsite.com">
          </div>

          <div class="field">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="••••••••" required>
          </div>

          <div class="field">
            <label for="regDob">Date of Birth</label>
            <input type="date" id="regDob">
          </div>

          <div class="field">
            <label for="regTime">Please select your time</label>
            <input type="time" id="regTime">
          </div>

          <div class="field">
            <label for="regColor">Please select your favourite color</label>
            <input type="color" id="regColor" value="#000000">
          </div>

          <div class="field">
            <label for="regFile">Please select your file</label>
            <div class="file-drop">
              <span class="file-btn">Choose Files</span>
              <span class="file-name" id="fileNameLabel">No file chosen</span>
              <input type="file" id="regFile">
            </div>
          </div>

          <div class="field">
            <label for="regOccupation">Please select your occupation</label>
            <select id="regOccupation">
              <option value="">-- Please select the item below --</option>
              <option value="student">Student</option>
              <option value="developer">Developer</option>
              <option value="designer">Designer</option>
              <option value="trader">Trader</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="regHobbies">Please select your hobbies</label>
            <select id="regHobbies" multiple>
              <option value="reading">Reading</option>
              <option value="music">Listen Music</option>
              <option value="hiking">Hiking</option>
              <option value="swimming">Swimming</option>
              <option value="gaming">Gaming</option>
              <option value="trading">Trading</option>
            </select>
            <div class="hint">Hold Ctrl (Cmd on Mac) to select multiple.</div>
          </div>

          <button type="submit" class="submit-btn" style="width:100%;">Submit</button>
          <div class="success-msg" id="registerSuccess">Account created successfully.</div>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
  function switchTab(target) {
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');

    if (target === 'login') {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginPanel.classList.add('active');
      registerPanel.classList.remove('active');
    } else {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerPanel.classList.add('active');
      loginPanel.classList.remove('active');
    }
  }

  document.getElementById('regFile').addEventListener('change', function (e) {
    const label = document.getElementById('fileNameLabel');
    label.textContent = e.target.files.length ? e.target.files[0].name : 'No file chosen';
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const successEl = document.getElementById('loginSuccess');
    successEl.classList.add('show');
    setTimeout(() => successEl.classList.remove('show'), 3000);
  });

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const successEl = document.getElementById('registerSuccess');
    successEl.classList.add('show');
    setTimeout(() => successEl.classList.remove('show'), 3000);
  });
</script>

</body>
</html>
